  <path d="M70 52 H160" stroke="#B49AD9" stroke-width="4" stroke-linecap="round"/>
  <text x="70" y="130" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="4" fill="#755A9D">PORTFÓLIO • TECNOLOGIA</text>
  <text x="70" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#24202B">Construindo soluções</text>
  <text x="70" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#5F566B">Desenvolvimento de sistemas · TI</text>
</svg>
